name: Publish fresque tile

on:
  workflow_dispatch: {}   # permet un déclenchement manuel pour tester
  schedule:
    # 3 déclenchements/jour, chacun publie 1 ligne (3 vignettes).
    # Horaires en UTC — ajuste si tu veux viser des heures précises
    # en heure de Paris (UTC+1 en hiver, UTC+2 en été).
    - cron: '15 8 * * *'
    - cron: '40 13 * * *'
    - cron: '5 19 * * *'

concurrency:
  group: publish-fresque-tile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Publish next tile
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish_next.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Publish next tile [skip ci]"
          # Le repo distant a pu avancer pendant l'exécution du script
          # (jitter + pauses peuvent durer jusqu'à ~40 min) — on rebase
          # avant de pousser, avec quelques tentatives en cas de nouvelle
          # course entre deux runs qui se chevaucheraient.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Tentative $i échouée, nouvel essai..."
            sleep 10
          done
